name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # base_path is "/<repo>" on github.io, or "" once a custom domain is set,
      # so asset URLs and routes stay correct either way.
      - name: Build static site
        run: bun run build
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Add SPA 404 fallback
        run: |
          cp dist/client/_shell.html dist/client/404.html
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
